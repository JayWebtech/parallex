# Parallax: the whole stack, locally and in production.
#   local:  pnpm stack:up        (= docker compose up --build, from the repo root)
#   prod:   see infra/deploy.md  (same file, SITE_ADDRESS set to the public hostname)
#
# Every image is pinned to an exact tag AND digest; Renovate proposes updates.
# Only Caddy publishes public ports. Postgres and Umami bind to 127.0.0.1 for
# local debugging only; in production leave *_HOST_PORT unset to skip them.
name: parallax

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?}
      PARALLAX_OWNER_PASSWORD: ${PARALLAX_OWNER_PASSWORD:?}
      PARALLAX_APP_PASSWORD: ${PARALLAX_APP_PASSWORD:?}
      PARALLAX_COLLECTOR_PASSWORD: ${PARALLAX_COLLECTOR_PASSWORD:?}
      PARALLAX_WORKER_PASSWORD: ${PARALLAX_WORKER_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 3s
      retries: 20

  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      geo:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?}
      # Neutral collect path (must match packages/tracker/tracker-versions.json).
      COLLECT_API_ENDPOINT: /p/e
      # Privacy + supply chain: no outbound calls, no telemetry, no update checks.
      DISABLE_TELEMETRY: '1'
      DISABLE_UPDATES: '1'
      PRIVATE_MODE: '1'
      # Visitor hash salt rotates daily: no visitor can be linked across days.
      SALT_ROTATION: day
      # Country-only geo: our DB has no region/city, and CDN geo headers are ignored.
      GEOLITE_DB_PATH: /geo/country.mmdb
      SKIP_LOCATION_HEADERS: '1'
      # Caddy is the only proxy; trust X-Forwarded-For from the private network.
      TRUSTED_PROXIES: private
    volumes:
      - ./geo/data:/geo:ro
    ports:
      - 127.0.0.1:${UMAMI_HOST_PORT:-3001}:3000
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:3000/api/heartbeat || exit 1']
      interval: 5s
      timeout: 3s
      retries: 40

  # Downloads the pinned country-only GeoIP DB once (checksum-verified).
  # Reuses the pinned postgres image (alpine + busybox wget) instead of pulling another one.
  geo:
    image: postgres:18.7-alpine3.24@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    entrypoint: [/geo/fetch-geo.sh]
    volumes:
      - ./geo:/geo
    restart: 'no'

  # One-shot: database migrations (as the schema owner) and Umami admin setup.
  setup:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    command: [sh, -c, 'node packages/db/dist/migrate.js && node packages/umami/dist/bootstrap.js']
    depends_on:
      postgres:
        condition: service_healthy
      umami:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://parallax_owner:${PARALLAX_OWNER_PASSWORD}@postgres:5432/parallax
      UMAMI_URL: http://umami:3000
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:?}
    restart: 'no'

  portal:
    build:
      context: ..
      dockerfile: Dockerfile
      target: portal
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://parallax_app:${PARALLAX_APP_PASSWORD}@postgres:5432/parallax
      PUBLIC_URL: ${PUBLIC_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      UMAMI_URL: http://umami:3000
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      DEMO_OPERATOR_EMAILS: ${DEMO_OPERATOR_EMAILS:-}
      PURGE_AFTER_HOURS: ${PURGE_AFTER_HOURS:-24}
      STELLAR_RPC_MAINNET_URL: ${STELLAR_RPC_MAINNET_URL:-}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-10}
      SIGNUP_RATE_LIMIT: ${SIGNUP_RATE_LIMIT:-5}
      DATA_REGION: ${DATA_REGION:-}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  # OTLP/HTTP receiver: keeps aggregates only (see apps/collector).
  collector:
    build:
      context: ..
      dockerfile: Dockerfile
      target: collector
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://parallax_collector:${PARALLAX_COLLECTOR_PASSWORD}@postgres:5432/parallax
      RATE_LIMIT_PER_SECOND: ${COLLECTOR_RATE_LIMIT_PER_SECOND:-20}
      RATE_LIMIT_BURST: ${COLLECTOR_RATE_LIMIT_BURST:-200}
      MAX_ROUTES_PER_PROJECT: ${MAX_ROUTES_PER_PROJECT:-1000}
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:4318/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  # Hourly/daily rollups and retention (single active replica via advisory lock).
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://parallax_worker:${PARALLAX_WORKER_PASSWORD}@postgres:5432/parallax
      # Purging a removed project deletes its Umami website.
      UMAMI_URL: http://umami:3000
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      PURGE_AFTER_HOURS: ${PURGE_AFTER_HOURS:-24}

  # Caddy (pinned in the Dockerfile's CADDY_IMAGE) with the example sites baked in.
  # ── Public demo (profile "demo"; on via COMPOSE_PROFILES=demo in .env) ──────
  # A fictional demo tenant fed by the apps in examples/. Shown read-only at /demo.

  # One-shot: demo owner, demo projects (is_demo) with fixed Umami websites, ingest key.
  demo-seed:
    profiles: [demo]
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    command: [node, apps/worker/dist/seed-demo.js]
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      MIGRATION_DATABASE_URL: postgresql://parallax_owner:${PARALLAX_OWNER_PASSWORD}@postgres:5432/parallax
      UMAMI_URL: http://umami:3000
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD}
      DEMO_INGEST_KEY: ${DEMO_INGEST_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL}
    restart: 'no'

  # examples/express-api, exporting its HTTP metrics to the collector with the demo key.
  demo-api:
    profiles: [demo]
    build:
      context: ..
      dockerfile: Dockerfile
      target: demo
    working_dir: /app/express-api
    command: [node, --import, ./src/telemetry.js, src/server.js]
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    environment:
      PORT: '4000'
      PARALLAX_ENDPOINT: http://collector:4318
      PARALLAX_INGEST_KEY: ${DEMO_INGEST_KEY}
      OTEL_SERVICE_NAME: demo-wallet-api
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10

  # examples/load-generator, running forever: API requests against demo-api and
  # synthetic visits to the two example sites (see its README).
  demo-traffic:
    profiles: [demo]
    build:
      context: ..
      dockerfile: Dockerfile
      target: demo
    working_dir: /app/load-generator
    command: [node, src/index.js]
    restart: unless-stopped
    depends_on:
      demo-api:
        condition: service_healthy
      umami:
        condition: service_healthy
    environment:
      DURATION_S: '0'
      TARGET_URL: http://demo-api:4000
      RPS: ${DEMO_API_RPS:-2}
      WEB_COLLECT_URL: http://umami:3000/p/e
      WEB_VISITS_PER_HOUR: ${DEMO_VISITS_PER_HOUR:-120}
      PUBLIC_URL: ${PUBLIC_URL}

  caddy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: edge
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
      umami:
        condition: service_healthy
      collector:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
