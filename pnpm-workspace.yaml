packages:
  - apps/*
  - packages/*
  - examples/*

# Supply-chain guards (see docs/security.md):
# - never install a package version published less than 3 days ago; most
#   malicious npm releases are detected and pulled within hours
# - dependency lifecycle scripts (postinstall etc.) are blocked unless listed
#   in onlyBuiltDependencies
minimumReleaseAge: 4320
onlyBuiltDependencies: []
